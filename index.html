<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppOnLuyen – Học từ và cấu trúc tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{--bg:#f3f6ff;--b1:#ffe1f0;--b2:#d4f3ff;--card:#fff;--tx:#1f2547;--mu:#6b7194;--p:#6c5ce7;--p2:#00cec9;--ok:#00b894;--bad:#ff6b6b;--wr:#ffa94d;--bd:#e4e8fb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13152a;--b1:#3a1d44;--b2:#12364a;--card:#1f2242;--tx:#eef0ff;--mu:#a5aad2;--bd:#2f3460;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13152a;--b1:#3a1d44;--b2:#12364a;--card:#1f2242;--tx:#eef0ff;--mu:#a5aad2;--bd:#2f3460;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);background:radial-gradient(circle at 0 0,var(--b1),transparent 45%),radial-gradient(circle at 100% 0,var(--b2),transparent 45%),var(--bg);background-attachment:fixed;min-height:100vh}
#app{max-width:880px;margin:0 auto;padding:14px 14px 120px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-weight:900;font-size:23px;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(108,92,231,.08);margin-bottom:14px}
.btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--p),#a29bfe);display:inline-block;text-align:center}
.btn.s{background:var(--bd);color:var(--tx)}.btn.g{background:linear-gradient(135deg,var(--ok),#55efc4)}.btn.r{background:linear-gradient(135deg,var(--bad),#ff9f9f)}.btn.o{background:linear-gradient(135deg,var(--wr),#ffd27f)}
.btn:active{transform:scale(.97)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p)}
input[hidden]{display:none}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(600px,100%);display:flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:24px 24px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(108,92,231,.15);z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:800;padding:6px 2px;border-radius:16px;cursor:pointer}
.nav b{display:block;font-size:20px}
.nav .on{background:linear-gradient(135deg,var(--p),#a29bfe);color:#fff}
.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;background:linear-gradient(135deg,#6c5ce7,#00cec9);color:#fff;border-radius:26px;padding:24px;font-weight:900;font-size:clamp(24px,6vw,38px);box-shadow:0 12px 30px rgba(108,92,231,.3)}
.fc.b{background:linear-gradient(135deg,#ff7aa8,#ffa94d)}
.fc small{font-size:15px;font-weight:600;opacity:.95}
.chip{border:2px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;font:inherit;font-weight:800;color:var(--mu);cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.g3 .card{margin:0;text-align:center;font-weight:700;color:var(--mu);padding:14px 6px}
.g3 b{display:block;font-size:28px;color:var(--p)}
.bar{height:12px;border-radius:9px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:9px;transition:width .3s}
.op{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:16px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.op.ok{border-color:var(--ok);background:rgba(0,184,148,.18)}.op.no{border-color:var(--bad);background:rgba(255,107,107,.18)}
.it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.it div{flex:1;min-width:0;overflow-wrap:anywhere}.it small{color:var(--mu);display:block}
.tag{font-size:11px;font-weight:900;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--p);margin-right:6px}
.ic{border:0;background:var(--bd);border-radius:12px;min-width:38px;height:38px;cursor:pointer;font-size:17px;color:var(--tx)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#1f2547;color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;z-index:9;max-width:92%;text-align:center}
.login{max-width:400px;margin:7vh auto 0;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{color:var(--mu);font-size:13px}
.big{font-size:clamp(22px,5vw,32px);font-weight:900;margin:8px 0 14px;overflow-wrap:anywhere}
@media(min-width:760px){#app{padding-top:26px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}}
:root:root:root{--bg:#F5F7FB;--b1:#E9EFFA;--b2:#F8F3E8;--card:#fff;--tx:#0F1F3D;--mu:#5B6785;--p:#0F2A5C;--p2:#2A5CAA;--ok:#1E7F5C;--bad:#B3433F;--wr:#B08D57;--bd:#E1E6F0;color-scheme:light}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#EAF0FA 0,#F5F7FB 320px) fixed}
h2,h3,.big,.fc span,.g3 b{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
h2,h3{color:var(--p);font-weight:700}
.logo{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:.3px;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--p);display:inline-flex;align-items:center;gap:8px}
.mark{display:inline-grid;place-items:center;background:var(--p);color:#fff;-webkit-text-fill-color:#fff;font-family:'Playfair Display',Georgia,serif;font-weight:700;box-shadow:0 4px 12px rgba(15,42,92,.25)}
.top .mark{width:34px;height:34px;font-size:18px;border-radius:10px}
.login .mark{width:64px;height:64px;font-size:32px;border-radius:18px;margin-bottom:8px}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(15,42,92,.04),0 10px 30px rgba(15,42,92,.06)}
.btn{background:var(--p);border-radius:12px;font-weight:600;letter-spacing:.2px;box-shadow:0 4px 12px rgba(15,42,92,.18)}
.btn.s{background:#E9EFFA;color:var(--p);box-shadow:none}.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}.btn.o{background:var(--wr)}
input,select,textarea{border:1.5px solid #D5DCEB;border-radius:12px}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(15,42,92,.1)}
.nav{border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(15,42,92,.08)}
.nav button{font-weight:600;color:#7B86A3}.nav .on{background:#E9EFFA;color:var(--p)}
.chip{font-weight:600}
.fc{background:linear-gradient(145deg,#0F2A5C,#1E4A94);font-weight:600;border-radius:20px;box-shadow:0 16px 40px rgba(15,42,92,.25)}
.fc.b{background:#FBF8F1;color:var(--p);border:1px solid #E6D9BC;box-shadow:0 12px 30px rgba(176,141,87,.18)}
.fc .ic{background:rgba(255,255,255,.16);color:#fff}.fc.b .ic{background:#EFE6D0;color:var(--p)}
.tag{background:#F3ECDD;color:#8A6B36;font-weight:700}
.ic{background:#E9EFFA;color:var(--p);display:inline-grid;place-items:center}
.i{width:1.15em;height:1.15em;vertical-align:-.2em}.nav .i{width:22px;height:22px;display:block;margin:0 auto 2px}.ic .i{width:18px;height:18px;vertical-align:middle}
.nav b{font-size:inherit}
.toast{background:var(--p)}
h2,h3,b{overflow-wrap:anywhere}code{user-select:all;font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
#app{padding-bottom:24px}
.ft{max-width:880px;margin:0 auto;padding:6px 14px calc(96px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mu);font-size:12.5px;line-height:1.7}
.ft a{color:var(--p);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.ft .cp{margin-top:6px;padding-top:8px;border-top:1px solid var(--bd)}
.btn:disabled{opacity:.6;cursor:wait}
</style></head><body>
<div id="app"></div><div id="tt"></div>
<footer class="ft"><div>Hỗ trợ sử dụng website: <a href="mailto:hotro-app.onluyen@ntak.io.vn">hotro-app.onluyen@ntak.io.vn</a></div><div>Hỗ trợ tài khoản: <a href="mailto:taikhoan-app.onluyen@ntak.io.vn">taikhoan-app.onluyen@ntak.io.vn</a></div><div class="cp">© 2026 Nguyen Trong An Khanh</div></footer>
<script>
const $=s=>document.querySelector(s),DEF='Abc@123',IV=[0,1,2,4,8,16];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,9);
const S={user:null,words:[],users:[],ap:{},prog:{},tab:'home',stage:[],loading:true,L:{f:'all',dir:'en',q:[],i:0,fl:false},Z:null,lf:'all',q:'',cf:null,busy:''};
let db=null,sample=null,sv=null,tm=null;
const FB='https://apponluyen-911fd-default-rtdb.asia-southeast1.firebasedatabase.app';/* Dán địa chỉ Firebase Realtime Database vào đây khi host trên GitHub, ví dụ 'https://ten-du-an-default-rtdb.asia-southeast1.firebasedatabase.app' (không có dấu / ở cuối) */
const LS={g(k){try{return JSON.parse(localStorage.getItem('ev:'+k))}catch(e){return null}},s(k,v){try{localStorage.setItem('ev:'+k,JSON.stringify(v))}catch(e){}},d(k){try{localStorage.removeItem('ev:'+k)}catch(e){}}};
function toast(m){clearTimeout(tm);$('#tt').innerHTML='<div class="toast">'+esc(m)+'</div>';tm=setTimeout(()=>$('#tt').innerHTML='',2600)}
async function kget(p){if(FB){const r=await fetch(FB+'/'+p+'.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}if(db){const s=await db.doc(p).get();return s.exists?s.data():null}return LS.g('d:'+p)}
async function kset(p,v){try{if(FB){const r=await fetch(FB+'/'+p+'.json',{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw new Error('http')}else if(db)await db.doc(p).set(v);else LS.s('d:'+p,v)}catch(e){toast('⚠️ Không lưu được dữ liệu');throw e}}
async function kdel(p){try{if(FB)await fetch(FB+'/'+p+'.json',{method:'DELETE'});else if(db)await db.doc(p).delete();else LS.d('d:'+p)}catch(e){toast('⚠️ Không xoá được')}}
async function klist(c){if(FB){const r=await fetch(FB+'/'+c+'.json',{cache:'no-store'});if(!r.ok)throw new Error('http');const o=(await r.json())||{};return Object.keys(o).map(k=>Object.assign({id:k},o[k]))}if(db){const s=await db.collection(c).get();return s.docs.map(d=>Object.assign({id:d.id},d.data()))}const o=[],pre='ev:d:'+c+'/';try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(pre))o.push(Object.assign({id:k.slice(pre.length)},JSON.parse(localStorage.getItem(k))))}}catch(e){}return o}
async function hash(u,p){return sha('ev1|'+u+'|'+p)}
const byId=id=>S.words.find(w=>w.id===id),pr=id=>S.prog[id],nrm=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const due=()=>S.words.filter(w=>!pr(w.id)||pr(w.id).d<=Date.now()),mast=()=>S.words.filter(w=>pr(w.id)&&pr(w.id).b>=4).length;
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
const isS=t=>/\b(sb|sth|someone|something)\b|\.\.\.|\+|~|\bV(-ing|-ed|\d)?\b|\bto V\b/i.test(t);
function sayId(id){const w=byId(id);if(w)say(w.en)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\b(sb|sth)\b/gi,'someone').replace(/\.\.\./g,' '));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
async function saveWords(){await kset('app/words',{items:S.words})}
function mark(id,r){const p=S.prog[id]||{b:0,d:0};if(r===0){p.b=0;p.d=Date.now()}else if(r===1){p.d=Date.now()+864e5}else{p.b=Math.min(5,p.b+1);p.d=Date.now()+IV[p.b]*864e5}S.prog[id]=p;clearTimeout(sv);sv=setTimeout(()=>kset('prog/'+S.user.k,{m:S.prog}).catch(()=>{}),600)}
async function refreshWords(){try{const d=await kget('app/words');if(d&&d.items)S.words=d.items}catch(e){}}

/* ===== Đăng nhập & phiên ===== */
async function login(){const u=norm($('#lu').value),p=$('#lp').value;if(!u||!p)return toast('Nhập username và mật khẩu nhé');const k=await uk(u);
 let rec;try{rec=await kget('users/'+k)}catch(e){return toast('Không tải được dữ liệu ('+(e.message||'lỗi mạng')+')')}
 const h=await hash(u,p);let ok=u==='admin'?(rec?rec.h===h:p===DEF):!!rec&&rec.h===h;
 if(!ok)return toast('Sai username hoặc mật khẩu 😢');
 await enter(u,rec);LS.s('sess',{u});toast('Chào mừng bạn! 🎉')}
async function enter(u,rec){const k=await uk(u);S.user={u,k,name:(rec&&rec.name)||(u==='admin'?'Tài khoản Admin':(rec&&rec.u)||u),admin:u==='admin',must:!!(rec&&rec.must)};
 try{const p=await kget('prog/'+k);S.prog=(p&&p.m)||{}}catch(e){S.prog={}}
 await refreshWords();S.tab=LS.g('tab')||'home';S.Z=null;buildQ();render()}
function logout(){LS.d('sess');S.newAcc=null;S.user=null;S.prog={};render()}
async function setPw(){const u=S.user,o=$('#po')?$('#po').value:'',n=$('#pn').value,c=$('#pc').value;
 if(n.length<6)return toast('Mật khẩu mới cần ít nhất 6 ký tự');if(n!==c)return toast('Hai mật khẩu chưa khớp');if(n===DEF)return toast('Hãy đặt mật khẩu khác mật khẩu mặc định');
 const rec=await kget('users/'+u.k);
 if(!u.must){const ok=rec?rec.h===await hash(u.u,o):o===DEF;if(!ok)return toast('Mật khẩu cũ chưa đúng')}
 await kset('users/'+u.k,Object.assign({},rec||{},{name:u.name,h:await hash(u.u,n),must:false}));u.must=false;toast('Đã đổi mật khẩu ✅');render()}
function go(t){S.tab=t;S.cf=null;if(t!=='stu')S.newAcc=null;LS.s('tab',t);if(t==='quiz')S.Z=null;refreshWords().then(async()=>{if(t==='learn')buildQ();if(t==='stu')await loadStu();render()});if(t==='learn')buildQ();render()}

/* ===== Học thẻ ===== */
function buildQ(){const L=S.L;let d=shuf(due().filter(w=>L.f==='all'||w.t===L.f));d.sort((a,b)=>((pr(a.id)||{}).b||0)-((pr(b.id)||{}).b||0));L.q=d.slice(0,15).map(w=>w.id);L.i=0;L.fl=false}
function rate(r){const L=S.L,id=L.q[L.i];mark(id,r);if(r===0)L.q.push(id);L.i++;L.fl=false;render()}
/* ===== Ôn tập ===== */
function startQ(mode){if(!S.words.length)return;S.Z={mode,q:shuf(S.words).sort((a,b)=>((pr(a.id)||{}).b||0)-((pr(b.id)||{}).b||0)).slice(0,10).map(w=>w.id),i:0,sc:0,a:null,o:[]};mkOpts();render()}
function mkOpts(){const Z=S.Z;if(Z.mode!=='mc')return;const w=byId(Z.q[Z.i]),oth=shuf(S.words.filter(x=>x.id!==w.id));const same=oth.filter(x=>x.t===w.t),rest=oth.filter(x=>x.t!==w.t);Z.o=shuf([w].concat(same.concat(rest).slice(0,3))).map(x=>x.id)}
function ans(v){const Z=S.Z;if(Z.a)return;const w=byId(Z.q[Z.i]);const ok=Z.mode==='mc'?v===w.id:(nrm(v)!==''&&nrm(v)===nrm(w.en));Z.a={ok,v};if(ok)Z.sc++;mark(w.id,ok?2:0);render()}
function nextQ(){const Z=S.Z;Z.i++;Z.a=null;if(Z.i<Z.q.length)mkOpts();render()}

/* ===== Thêm từ (admin) ===== */
function parse(txt,t){return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{let p=l.split(/\s*[|\t;]\s*/);if(p.length<2)p=l.split(/\s+[-–—:=]\s+/);if(p.length<2){const m=l.match(/^([^,]+),(.+)$/);p=m?[m[1],m[2]]:[l]}if(p.length<2)return null;const en=p[0].trim(),vi=p[1].trim();if(!en||!vi)return null;return{id:rid(),t:t==='auto'?(isS(en)?'s':'w'):t,en,vi,ex:(p[2]||'').trim()}}).filter(Boolean)}
async function addOne(){const en=$('#me').value.trim(),vi=$('#mv').value.trim();if(!en||!vi)return toast('Nhập đủ từ/cấu trúc và nghĩa nhé');
 if(S.words.some(w=>w.en.toLowerCase()===en.toLowerCase()))return toast('Mục này đã có rồi');
 S.words.push({id:rid(),t:$('#mt').value,en,vi,ex:$('#mx').value.trim()});await saveWords();toast('Đã thêm ✅');render()}
function readText(){const t=parse($('#bk').value,$('#bt').value);if(!t.length)return toast('Chưa đọc được dòng nào. Dùng dạng: từ | nghĩa | ví dụ');S.stage=S.stage.concat(t);render()}
function upf(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const t=parse(String(r.result),$('#bt').value);toast(t.length?'Đọc được '+t.length+' mục':'File chưa đúng dạng từ | nghĩa');S.stage=S.stage.concat(t);render()};r.readAsText(f)}
async function photo(inp){const f=inp.files[0];if(!f)return;if(!sample)return toast('Đọc ảnh chưa khả dụng ở phiên này, hãy dùng nhập tay hoặc up file');
 S.busy='📷 Đang đọc ảnh, chờ xíu nhé…';render();
 try{const r=await sample.json('Đây là ảnh chứa danh sách từ vựng hoặc cấu trúc tiếng Anh kèm nghĩa tiếng Việt. Trích xuất TOÀN BỘ các mục. Chỉ trả về một mảng JSON, không thêm chữ nào khác: [{"t":"w hoặc s","en":"từ hoặc cấu trúc tiếng Anh","vi":"nghĩa tiếng Việt","ex":"ví dụ nếu trong ảnh có, nếu không để chuỗi rỗng"}]. t là s với cấu trúc ngữ pháp (có sb, sth, to V, V-ing, dấu +, ...), t là w với từ hoặc cụm từ đơn.',{images:[f]});
  const a=Array.isArray(r)?r:[];a.forEach(x=>{if(x&&x.en&&x.vi)S.stage.push({id:rid(),t:x.t==='s'?'s':'w',en:String(x.en).trim(),vi:String(x.vi).trim(),ex:String(x.ex||'').trim()})});toast(a.length?'Đọc được '+a.length+' mục':'Không thấy chữ nào trong ảnh')}
 catch(e){toast('Không đọc được ảnh, thử ảnh rõ hơn nhé')}S.busy='';render()}
async function saveStage(){let n=0;S.stage.forEach(x=>{if(!S.words.some(w=>w.en.toLowerCase()===x.en.toLowerCase())){S.words.push(x);n++}});S.stage=[];await saveWords();toast('Đã lưu '+n+' mục mới ✅');render()}
async function delW(id){if(S.cf!==id){S.cf=id;toast('Bấm thêm lần nữa để xoá');return filt()}S.cf=null;S.words=S.words.filter(w=>w.id!==id);await saveWords();filt()}
const MAIL_KEY='0dadb602-560e-48b5-88a7-7a40637148de';/* Dán Access Key của Web3Forms vào đây để gửi email thông báo khi tạo tài khoản */
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function genPw(){const U='ABCDEFGHJKLMNPQRSTUVWXYZ',L='abcdefghijkmnopqrstuvwxyz',D='23456789',P='!@#$%&*?+=-_',all=U+L+D+P,pick=s=>s[rnd(s.length)],c=[pick(U),pick(L),pick(D),pick(P)];while(c.length<10)c.push(pick(all));for(let i=c.length-1;i>0;i--){const j=rnd(i+1);[c[i],c[j]]=[c[j],c[i]]}return c.join('')}
const mask=s=>{const c=[...String(s)];return c.length<2?'*':c[0]+'*'.repeat(c.length-2)+(c.length>2?c[c.length-1]:'*')};
const SHA=(()=>{const K=[],H0=[];for(let c=2,n=0;n<64;c++){let p=1;for(let d=2;d*d<=c;d++)if(c%d==0){p=0;break}if(p){if(n<8)H0[n]=(Math.pow(c,.5)*4294967296)|0;K[n++]=(Math.pow(c,1/3)*4294967296)|0}}
return s=>{const b=new TextEncoder().encode(s),l=b.length,nb=((l+9+63)>>6)<<6,m=new Uint8Array(nb);m.set(b);m[l]=128;const dv=new DataView(m.buffer);dv.setUint32(nb-4,(l*8)>>>0);dv.setUint32(nb-8,Math.floor(l*8/4294967296));const h=H0.slice(),w=new Int32Array(64),r=(x,n)=>(x>>>n)|(x<<(32-n));
for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);for(let i=16;i<64;i++){const a=w[i-15],z=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(z,17)^r(z,19)^(z>>>10)))|0}
let [a,b2,c,d,e,f,g,q]=h;for(let i=0;i<64;i++){const t1=(q+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))|0;q=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
h[0]=(h[0]+a)|0;h[1]=(h[1]+b2)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+q)|0}
return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}})();
async function sha(s){try{if(window.crypto&&crypto.subtle)return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}return SHA(s)}
const norm=s=>String(s).normalize('NFC').trim().toLowerCase();
async function uk(u){if(/^[a-z0-9_-]{1,100}$/.test(u))return u;return '~'+await sha('uk|'+u)}
